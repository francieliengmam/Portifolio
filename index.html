<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francieli Engmam | Data Analyst & BI Specialist</title>
    <!-- Google Fonts Executivas e Modernas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta Dark Mode Tech Premium */
            --bg-dark: #090a10;
            --bg-surface: #121420;
            --bg-card: #191c2e;
            --border-color: #272b43;
            --border-hover: #5b6294;
            
            --text-white: #ffffff;
            --text-body: #a2a8cc;
            --text-muted: #656b96;
            
            /* Destaques Neon */
            --accent-purple: #7047eb;
            --accent-purple-hover: #8862f9;
            --accent-cyan: #00d2ff;
            --accent-green: #00e6a8;
            
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-body);
            font-family: var(--font-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* --- Navbar Superior --- */
        navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(9, 10, 16, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-white);
            letter-spacing: -0.02em;
        }

        .brand-logo span { color: var(--accent-purple); }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-body);
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--accent-cyan); }

        .btn-nav {
            background: var(--accent-purple);
            color: var(--text-white);
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-nav:hover { background: var(--accent-purple-hover); }

        /* --- Hero Section Centralizada --- */
        .hero-section {
            padding-top: 170px;
            padding-bottom: 90px;
            text-align: center;
        }

        .hero-name {
            font-size: 3.8rem;
            font-weight: 800;
            color: #ffffff !important;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
            line-height: 1.1;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-cyan);
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.25);
            padding: 6px 18px;
            border-radius: 30px;
            margin-bottom: 28px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            color: var(--text-white);
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-title .highlight {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.15rem;
            color: var(--text-body);
            max-width: 780px;
            margin: 0 auto 36px auto;
            font-weight: 400;
        }

        .hero-cta {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: var(--accent-purple);
            color: var(--text-white);
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(112, 71, 235, 0.35);
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--accent-purple-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-white);
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* --- About Section com Imagem Corrigida (Card Formato) --- */
        .section-padding {
            padding: 90px 0;
            border-top: 1px solid var(--border-color);
        }

        .section-header {
            margin-bottom: 50px;
        }

        .section-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: block;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-white);
            letter-spacing: -0.02em;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            align-items: center;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
        }

        .about-img-container {
            width: 100%;
            text-align: center;
        }

        /* Estilo corrigido para aceitar imagens/banners horizontais perfeitamente */
        .about-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .about-content-box {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .about-text p {
            font-size: 1.05rem;
            color: var(--text-body);
            margin-bottom: 16px;
        }

        .info-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            font-size: 0.95rem;
        }

        .info-label { color: var(--text-muted); font-weight: 500; }
        .info-value { color: var(--text-white); font-weight: 600; }

        /* --- Tech Stack Section --- */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .skill-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .skill-card:hover {
            border-color: var(--accent-purple);
            transform: translateY(-3px);
        }

        .skill-card h4 {
            color: var(--text-white);
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .skill-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* --- Projects Case Studies --- */
        .projects-grid {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .project-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            transition: all 0.25s;
        }

        .project-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .project-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
            display: block;
        }

        .project-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 16px;
        }

        .project-desc {
            font-size: 1rem;
            color: var(--text-body);
            margin-bottom: 24px;
